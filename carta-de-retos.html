    <style>
        :root {
            --primary: #4f46e5;
            --success: #22c55e;
            --bg: #e5e7eb;
            --card-bg: #fffdfa; /* Color papel */
            --text: #1f2937;
        }

        body {
            font-family: 'Courier New', Courier, monospace; /* Fuente estilo máquina de escribir */
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        #timer {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 10px 0;
            color: #374151;
        }

        /* Estilo de la Carta Física */
        .physical-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 2px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
            border: 1px solid #d1d5db;
            margin-bottom: 30px;
            position: relative;
            min-height: 300px;
        }

        /* Líneas decorativas de libreta */
        .physical-card::before {
            content: '';
            position: absolute;
            left: 40px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(239, 68, 68, 0.2);
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            text-align: left;
        }

        .option-item {
            padding: 15px 10px 15px 50px;
            margin: 10px 0;
            border-bottom: 1px dashed #ccc;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.2s;
            border-radius: 4px;
            user-select: none;
        }

        .option-item:hover {
            background-color: rgba(0,0,0,0.03);
        }

        /* Clase cuando se marca como logrado */
        .option-item.done {
            background-color: var(--success);
            color: white;
            border-bottom-color: transparent;
            text-decoration: line-through;
        }

        button {
            background-color: #374151;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #000;
        }

        .timer-warning {
            color: #ef4444 !important;
        }
    </style>

        let timeLeft = 30;
        let timerInterval;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Función para generar un "Beep" de fin de tiempo
        function playEndSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // Nota La
            oscillator.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.5);
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            const timerDisplay = document.getElementById('timer');
            timerDisplay.classList.remove('timer-warning');
            timerDisplay.innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;

                if (timeLeft <= 5) timerDisplay.classList.add('timer-warning');

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = "¡FIN!";
                    playEndSound();
                }
            }, 1000);
        }

        function refreshApp() {
            // Desbloquear audio en navegadores modernos tras click
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const list = document.getElementById('options-list');
            list.innerHTML = '';
            
            const categorias = Object.keys(database);
            const seleccionadas = categorias.sort(() => 0.5 - Math.random()).slice(0, 5);

            seleccionadas.forEach(cat => {
                const items = database[cat];
                const itemRandom = items[Math.floor(Math.random() * items.length)];
                
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerText = itemRandom;
                
                // Evento para marcar en verde
                li.onclick = function() {
                    this.classList.toggle('done');
                };

                list.appendChild(li);
            });

            startTimer();
        }

        window.onload = refreshApp;
