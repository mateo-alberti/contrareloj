    <style>
        :root {
            --primary: #4f46e5;
            --success: #16a34a;
            --bg: #111827;
            --card-bg: #fffefc;
            --text: #1f2937;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        #timer {
            font-size: 4.5rem;
            font-weight: bold;
            margin: 0;
            color: #ef4444;
            text-shadow: 2px 2px 0px #000;
        }

        #counter {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .physical-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 4px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.3);
            border: 1px solid #9ca3af;
            margin-bottom: 25px;
            position: relative;
            min-height: 420px;
            color: var(--text);
            transform: rotate(-0.5deg);
        }

        .physical-card::before {
            content: '';
            position: absolute;
            left: 40px;
            top: 0;
            bottom: 0;
            width: 2px;
            border-left: 2px double rgba(239, 68, 68, 0.2);
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            text-align: left;
        }

        .option-item {
            padding: 15px 10px 15px 50px;
            margin: 5px 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.2s;
            user-select: none;
            line-height: 1.2;
        }

        .option-item.done {
            background-color: var(--success);
            color: white;
            text-decoration: line-through;
            border-radius: 4px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            border: none;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #4b5563;
            transition: transform 0.1s;
        }

        .btn-main { background-color: #f9fafb; color: #111827; }
        .btn-reset { background-color: #374151; color: #9ca3af; font-size: 0.75rem; box-shadow: none; }
        
        button:active { transform: translateY(4px); box-shadow: none; }
        .timer-warning { animation: pulse 0.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.3; } }
    </style>
</head>

        let availablePool = [];
        let timeLeft = 30;
        let timerInterval;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function hardReset() {
            const confirmReset = window.confirm("¿Estás seguro de que quieres reiniciar todo el mazo? Se perderá el progreso de las palabras que ya salieron.");
            
            if (confirmReset) {
                availablePool = [];
                for (let cat in originalData) {
                    originalData[cat].forEach(item => availablePool.push(item));
                }
                alert("Mazo reiniciado: 1,540 palabras cargadas.");
                nextRound();
            }
        }

        function playEndSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(330, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
            osc.start(); osc.stop(audioCtx.currentTime + 1);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            const timerDisplay = document.getElementById('timer');
            timerDisplay.classList.remove('timer-warning');
            timerDisplay.innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 5) timerDisplay.classList.add('timer-warning');
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = "¡FIN!";
                    playEndSound();
                }
            }, 1000);
        }

        function nextRound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const list = document.getElementById('options-list');
            const counter = document.getElementById('counter');
            list.innerHTML = '';

            if (availablePool.length < 5) {
                alert("¡Mazo agotado! Reiniciando automáticamente.");
                availablePool = [];
                for (let cat in originalData) {
                    originalData[cat].forEach(item => availablePool.push(item));
                }
            }

            for (let i = 0; i < 5; i++) {
                const randomIndex = Math.floor(Math.random() * availablePool.length);
                const item = availablePool.splice(randomIndex, 1)[0];
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerText = item;
                li.onclick = function() { this.classList.toggle('done'); };
                list.appendChild(li);
            }

            counter.innerText = `${availablePool.length} PALABRAS DISPONIBLES`;
            startTimer();
        }

        window.onload = () => {
            for (let cat in originalData) {
                originalData[cat].forEach(item => availablePool.push(item));
            }
            nextRound();
        };
    </script>
</body>
</html>
