    <style>
        :root {
            --primary: #4f46e5;
            --success: #22c55e;
            --bg: #d1d5db;
            --card-bg: #fffdfa;
            --text: #1f2937;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        #timer {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 5px 0;
            color: #111827;
            text-shadow: 1px 1px 0px white;
        }

        #counter {
            font-size: 0.75rem;
            color: #4b5563;
            margin-bottom: 10px;
            font-weight: bold;
            background: rgba(255,255,255,0.5);
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        .physical-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 2px;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.1);
            border: 1px solid #9ca3af;
            margin-bottom: 20px;
            position: relative;
            min-height: 380px;
        }

        .physical-card::before {
            content: '';
            position: absolute;
            left: 35px;
            top: 0;
            bottom: 0;
            width: 1px;
            border-left: 2px double rgba(239, 68, 68, 0.3);
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
            text-align: left;
        }

        .option-item {
            padding: 12px 10px 12px 45px;
            margin: 5px 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.2s;
            user-select: none;
            line-height: 1.2;
        }

        .option-item.done {
            background-color: var(--success);
            color: white;
            text-decoration: line-through;
            border-radius: 4px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            border: 2px solid #374151;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px #374151;
            transition: all 0.1s;
        }

        .btn-main { background-color: #374151; color: white; }
        .btn-reset { background-color: #f3f4f6; color: #374151; font-size: 0.7rem; box-shadow: 2px 2px 0px #374151;}
        
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #374151;
        }

        .timer-warning { color: #ef4444 !important; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>

            "personajes": ["Batman", "Superman", "Spider-Man", "Sherlock Holmes", "James Bond", "Harry Potter", "Darth Vader", "Luke Skywalker", "Wonder Woman", "Iron Man", "Capitán América", "Hulk", "Wolverine", "Thor", "Joker", "Katniss Everdeen", "Frodo Bolsón", "Gandalf", "Gollum", "Hércules Poirot", "Drácula", "Frankenstein", "El Grinch", "Mickey Mouse", "Pato Donald", "Bugs Bunny", "Homer Simpson", "Peter Griffin", "Bob Esponja", "Pikachu", "Mario", "Link", "Zelda", "Kratos", "Lara Croft", "Master Chief", "Nathan Drake", "Jon Snow", "Daenerys Targaryen", "Walter White", "Don Draper", "Tony Soprano", "Michael Scott", "Indiana Jones", "Han Solo", "Jack Sparrow", "Rick Sanchez", "Morty Smith", "Optimus Prime", "Scooby-Doo"]
        };

        let availablePool = [];
        let timeLeft = 30;
        let timerInterval;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function hardReset() {
            availablePool = [];
            for (let cat in originalData) {
                originalData[cat].forEach(item => availablePool.push(item));
            }
            alert("Mazo reseteado con 1,105 palabras.");
            nextRound();
        }

        function playEndSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(330, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            const timerDisplay = document.getElementById('timer');
            timerDisplay.classList.remove('timer-warning');
            timerDisplay.innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 5) timerDisplay.classList.add('timer-warning');
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = "¡FIN!";
                    playEndSound();
                }
            }, 1000);
        }

        function nextRound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const list = document.getElementById('options-list');
            const counter = document.getElementById('counter');
            list.innerHTML = '';

            if (availablePool.length < 5) {
                alert("Mazo agotado. ¡Reiniciando automáticamente!");
                hardReset();
                return;
            }

            for (let i = 0; i < 5; i++) {
                const randomIndex = Math.floor(Math.random() * availablePool.length);
                const item = availablePool.splice(randomIndex, 1)[0];
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerText = item;
                li.onclick = function() { this.classList.toggle('done'); };
                list.appendChild(li);
            }

            counter.innerText = `MAZO: ${availablePool.length} RESTANTES`;
            startTimer();
        }

        window.onload = () => {
            for (let cat in originalData) {
                originalData[cat].forEach(item => availablePool.push(item));
            }
            nextRound();
        };
    </script>
